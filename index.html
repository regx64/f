<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>다 떨어뜨려! – 고양이 시뮬레이터</title>
<style>
  :root { --ink:#3b2a1a; --cream:#fff4e0; --orange:#ff9d3c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#1d1410; overflow:hidden;
    font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; color:var(--ink); }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:min(100vw, calc(100vh * 1.6)); aspect-ratio:960/600; }
  canvas { width:100%; height:100%; display:block; border-radius:10px; cursor:none; touch-action:none;
    box-shadow:0 20px 80px rgba(0,0,0,.6); }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(29,20,16,.62); backdrop-filter:blur(3px); border-radius:10px; }
  .overlay.show { display:flex; }
  .card { background:var(--cream); border-radius:22px; padding:clamp(14px,3vw,30px) clamp(18px,4vw,42px);
    text-align:center; max-width:88%; box-shadow:0 10px 0 #c98a3f, 0 24px 60px rgba(0,0,0,.5);
    animation:pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform:scale(.6) rotate(-4deg); opacity:0 } }
  h1 { margin:0; font-size:clamp(24px,5.4vw,52px); line-height:1.05; letter-spacing:-1px; }
  h1 small { display:block; font-size:.36em; letter-spacing:0; color:#a86a2a; margin-top:.4em; font-weight:700; }
  p { margin:.7em 0; font-size:clamp(11px,1.9vw,17px); line-height:1.5; }
  .rules { text-align:left; display:inline-block; }
  .btn { font:inherit; font-weight:800; font-size:clamp(15px,2.6vw,24px); background:var(--orange); color:#fff;
    border:0; border-radius:14px; padding:.55em 1.4em; cursor:pointer; box-shadow:0 5px 0 #c4661a; text-shadow:0 2px 0 rgba(0,0,0,.2); }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #c4661a; }
  .big { font-size:clamp(28px,6vw,60px); font-weight:900; color:#e2531f; }
  #mute { position:absolute; right:10px; bottom:10px; font-size:22px; background:rgba(255,255,255,.75);
    border:0; border-radius:50%; width:40px; height:40px; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" width="960" height="600"></canvas>

  <div id="title" class="overlay show"><div class="card">
    <h1>🐱 다 떨어뜨려!<small>KNOCK IT OFF · 고양이 중력 실험 시뮬레이터</small></h1>
    <p class="rules">
      🐾 <b>클릭/터치</b>로 물건을 앞발로 쳐서 탁자 밖으로!<br>
      💥 깨지는 물건일수록 고득점, 연속으로 떨어뜨리면 <b>콤보 배수</b>!<br>
      👀 집사가 <b>쳐다볼 때</b> 치면 딱 걸려요. 물건들이 비명을 지릅니다.<br>
      🤬 분노 게이지가 가득 차면 게임 끝. 💻 노트북은 <b>대박</b>입니다.
    </p>
    <button class="btn" id="startBtn">냥! 시작하기</button>
  </div></div>

  <div id="over" class="overlay"><div class="card">
    <div class="big" id="ovTitle">집사 폭발!</div>
    <p id="ovMsg"></p>
    <p>점수 <b id="ovScore">0</b> · 최고 <b id="ovBest">0</b><br><span id="ovRank"></span></p>
    <button class="btn" id="againBtn">다시 저지르기 🐾</button>
  </div></div>

  <button id="mute" title="소리 켜기/끄기">🔊</button>
</div></div>

<script>
(() => {
'use strict';
const W = 960, H = 600, S = 2, TABLE_Y = 340, TX0 = 30, TX1 = 660, FLOOR_Y = 528, G = 1500;
const SHOULDER = { x: 150, y: TABLE_Y - 42 };
const IDLE_PAW = { x: 178, y: TABLE_Y - 10 };
const HUMAN = { x: 830 };
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const UI_FONT = 'system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

const cvs = document.getElementById('c');
cvs.width = W * S; cvs.height = H * S;
const ctx = cvs.getContext('2d');
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- drawing helpers ----------
const lg = (g, x0, y0, x1, y1, st) => { const q = g.createLinearGradient(x0, y0, x1, y1); st.forEach(s => q.addColorStop(s[0], s[1])); return q; };
const rg = (g, x, y, r0, r1, st) => { const q = g.createRadialGradient(x, y, r0, x, y, r1); st.forEach(s => q.addColorStop(s[0], s[1])); return q; };
const ell = (g, x, y, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, 7); };
const rr = (g, x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- procedural item art (u = item radius) ----------
function dMilk(g, u) {
  const top = -u * 1.0, bot = u * 1.0, tw = u * .66, bw = u * .52;
  const path = () => { g.beginPath(); g.moveTo(-tw, top); g.lineTo(tw, top); g.lineTo(bw, bot - 3); g.quadraticCurveTo(bw, bot, bw - 4, bot); g.lineTo(-bw + 4, bot); g.quadraticCurveTo(-bw, bot, -bw, bot - 3); g.closePath(); };
  path(); g.fillStyle = lg(g, -tw, 0, tw, 0, [[0, 'rgba(200,225,250,.55)'], [.5, 'rgba(255,255,255,.22)'], [1, 'rgba(170,200,230,.6)']]); g.fill();
  g.save(); path(); g.clip();
  const my = top + u * .42;
  g.fillStyle = lg(g, -tw, 0, tw, 0, [[0, '#dfe6f0'], [.35, '#ffffff'], [1, '#d6dde8']]); g.fillRect(-tw, my, tw * 2, bot - my);
  g.fillStyle = '#fbfcff'; ell(g, 0, my, tw * .98, u * .13); g.fill();
  g.restore();
  path(); g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1.4; g.stroke();
  g.strokeStyle = 'rgba(90,120,150,.45)'; g.lineWidth = .8; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.7)'; rr(g, -tw * .68, top + u * .25, u * .14, u * 1.3, u * .07); g.fill();
  g.fillStyle = 'rgba(255,255,255,.35)'; rr(g, tw * .5, top + u * .35, u * .08, u * 1.1, u * .04); g.fill();
}
function dMug(g, u) {
  const w = u * .66, h = u * .74;
  g.strokeStyle = '#a5321f'; g.lineWidth = u * .24; g.lineCap = 'round'; g.beginPath(); g.arc(w - u * .05, u * .02, u * .4, -1.25, 1.25); g.stroke();
  g.strokeStyle = 'rgba(255,190,170,.35)'; g.lineWidth = u * .06; g.beginPath(); g.arc(w - u * .05, u * .02, u * .43, -1.0, .6); g.stroke();
  g.fillStyle = lg(g, -w, 0, w, 0, [[0, '#7c2416'], [.28, '#e4593f'], [.5, '#cc4630'], [1, '#6c1e12']]);
  rr(g, -w, -h, w * 2, h * 2, u * .2); g.fill();
  g.fillStyle = '#f4ede1'; ell(g, 0, -h, w, u * .22); g.fill();
  g.fillStyle = rg(g, -u * .1, -h, 1, w, [[0, '#6b3f22'], [1, '#2c170c']]); ell(g, 0, -h + 1, w * .86, u * .17); g.fill();
  g.fillStyle = 'rgba(255,255,255,.4)'; rr(g, -w * .6, -h * .55, w * .17, h * 1.1, 3); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; g.font = `900 ${u * .5}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('♥', -w * .05, u * .1);
}
function dPlant(g, u) {
  for (let i = -3; i <= 3; i++) {
    const len = u * (1.15 - Math.abs(i) * .08); g.save(); g.translate(i * u * .05, -u * .12); g.rotate(i * .36);
    g.fillStyle = lg(g, -u * .2, 0, u * .2, 0, [[0, '#2f7a32'], [.5, '#66b84a'], [1, '#2a6b2c']]);
    ell(g, 0, -len * .5, u * .21, len * .5); g.fill();
    g.strokeStyle = 'rgba(20,70,25,.5)'; g.lineWidth = .8; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -len * .95); g.stroke(); g.restore();
  }
  g.fillStyle = '#4a2c17'; ell(g, 0, -u * .1, u * .72, u * .16); g.fill();
  g.beginPath(); g.moveTo(-u * .7, -u * .08); g.lineTo(u * .7, -u * .08); g.lineTo(u * .5, u); g.lineTo(-u * .5, u); g.closePath();
  g.fillStyle = lg(g, -u * .7, 0, u * .7, 0, [[0, '#8f3f1e'], [.35, '#e0794a'], [.6, '#c45f36'], [1, '#77321a']]); g.fill();
  g.fillStyle = lg(g, -u * .82, 0, u * .82, 0, [[0, '#8f3f1e'], [.35, '#eb8a58'], [1, '#77321a']]); rr(g, -u * .8, -u * .16, u * 1.6, u * .3, u * .1); g.fill();
  g.fillStyle = 'rgba(255,255,255,.28)'; rr(g, -u * .45, u * .2, u * .1, u * .6, 3); g.fill();
}
function dPhone(g, u) {
  const w = u * .6, h = u * 1.05;
  g.fillStyle = lg(g, -w, -h, w, h, [[0, '#4a4f5c'], [1, '#12141a']]); rr(g, -w, -h, w * 2, h * 2, u * .2); g.fill();
  g.strokeStyle = '#8b90a0'; g.lineWidth = .8; g.stroke();
  g.fillStyle = lg(g, -w, -h, w, h, [[0, '#59b0ff'], [.55, '#6a6cff'], [1, '#c15cff']]); rr(g, -w + 2.5, -h + 3.5, w * 2 - 5, h * 2 - 7, u * .15); g.fill();
  g.fillStyle = 'rgba(255,255,255,.9)'; g.font = `700 ${u * .42}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('12:30', 0, -h * .55);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 2; j++) { g.fillStyle = `rgba(255,255,255,${.55 + (i + j) % 2 * .25})`; rr(g, -w * .72 + j * w * .78, -h * .12 + i * u * .34, w * .56, u * .24, 2.5); g.fill(); }
  g.fillStyle = 'rgba(255,255,255,.16)'; g.beginPath(); g.moveTo(-w, -h); g.lineTo(0, -h); g.lineTo(-w, 0); g.closePath(); g.fill();
}
function dVase(g, u) {
  const path = () => { g.beginPath(); g.moveTo(-u * .34, -u * 1.05); g.bezierCurveTo(-u * .3, -u * .5, -u * .98, -u * .3, -u * .88, u * .3);
    g.bezierCurveTo(-u * .82, u * .75, -u * .5, u * .85, -u * .48, u * 1.0); g.lineTo(u * .48, u * 1.0);
    g.bezierCurveTo(u * .5, u * .85, u * .82, u * .75, u * .88, u * .3); g.bezierCurveTo(u * .98, -u * .3, u * .3, -u * .5, u * .34, -u * 1.05); g.closePath(); };
  path(); g.fillStyle = lg(g, -u, 0, u, 0, [[0, '#a9b8d4'], [.3, '#ffffff'], [.6, '#e7edf7'], [1, '#93a4c4']]); g.fill();
  g.save(); path(); g.clip(); g.strokeStyle = '#1f4f9a'; g.lineWidth = u * .07;
  for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(-u, -u * .05 + i * u * .16); g.bezierCurveTo(-u * .3, u * .08 + i * u * .16, u * .3, -u * .12 + i * u * .16, u, -u * .05 + i * u * .16); g.stroke(); }
  g.fillStyle = '#1f4f9a'; g.fillRect(-u, -u * 1.05, u * 2, u * .12);
  g.fillStyle = 'rgba(31,79,154,.85)'; for (let i = -2; i <= 2; i++) { ell(g, i * u * .3, u * .55, u * .09, u * .16, i * .3); g.fill(); }
  g.restore(); path(); g.strokeStyle = 'rgba(40,60,100,.5)'; g.lineWidth = 1; g.stroke();
  g.fillStyle = 'rgba(255,255,255,.7)'; ell(g, -u * .52, -u * .02, u * .1, u * .38, .12); g.fill();
}
function dCake(g, u) {
  g.fillStyle = lg(g, 0, u * .7, 0, u * 1.05, [[0, '#ffffff'], [1, '#c9cfd8']]); ell(g, 0, u * .88, u * 1.1, u * .2); g.fill();
  const layer = (y, h, c1, c2) => { g.fillStyle = lg(g, -u * .85, 0, u * .85, 0, [[0, c1], [.4, c2], [1, c1]]); rr(g, -u * .85, y, u * 1.7, h, u * .08); g.fill(); };
  layer(u * .12, u * .72, '#5a3018', '#8a5228');
  g.fillStyle = '#fff3d6'; rr(g, -u * .87, -u * .08, u * 1.74, u * .22, u * .06); g.fill();
  layer(-u * .5, u * .44, '#5a3018', '#8a5228');
  g.fillStyle = lg(g, 0, -u * .7, 0, -u * .3, [[0, '#ffc4d6'], [1, '#f290b4']]); ell(g, 0, -u * .5, u * .88, u * .24); g.fill();
  g.fillStyle = '#f290b4'; for (let i = -3; i <= 3; i++) { rr(g, i * u * .27 - u * .07, -u * .5, u * .14, u * (.18 + (i & 1 ? .1 : .02)), u * .07); g.fill(); }
  g.fillStyle = rg(g, -u * .06, -u * .92, 1, u * .24, [[0, '#ff6a6a'], [1, '#a30d1f']]); ell(g, 0, -u * .82, u * .2, u * .2); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; ell(g, -u * .07, -u * .88, u * .05, u * .04); g.fill();
  g.strokeStyle = '#3a7a2a'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(0, -u * 1.0); g.quadraticCurveTo(u * .1, -u * 1.15, u * .22, -u * 1.12); g.stroke();
}
function dEgg(g, u) {
  g.fillStyle = rg(g, -u * .3, -u * .4, 1, u * 1.1, [[0, '#fffaf0'], [.6, '#f1dfc0'], [1, '#c9ac82']]);
  g.beginPath(); g.moveTo(0, -u * 1.0); g.bezierCurveTo(u * .85, -u * .8, u * .85, u * .95, 0, u * .95); g.bezierCurveTo(-u * .85, u * .95, -u * .85, -u * .8, 0, -u * 1.0); g.fill();
  g.fillStyle = 'rgba(255,255,255,.75)'; ell(g, -u * .3, -u * .4, u * .12, u * .25, .4); g.fill();
}
function dCamera(g, u) {
  g.fillStyle = lg(g, 0, -u * .7, 0, u * .7, [[0, '#4a4d55'], [1, '#17181c']]); rr(g, -u * 1.05, -u * .6, u * 2.1, u * 1.3, u * .18); g.fill();
  g.fillStyle = lg(g, 0, -u * .7, 0, -u * .3, [[0, '#f0f2f5'], [1, '#a8adb6']]); rr(g, -u * 1.05, -u * .68, u * 2.1, u * .38, u * .14); g.fill();
  g.fillStyle = '#d33'; ell(g, -u * .75, -u * .48, u * .09, u * .09); g.fill();
  g.fillStyle = '#ddd'; rr(g, u * .45, -u * .82, u * .35, u * .16, 3); g.fill();
  g.fillStyle = rg(g, 0, u * .1, u * .1, u * .56, [[0, '#0b0c14'], [.7, '#20222c'], [1, '#c8ccd4']]); ell(g, 0, u * .1, u * .56, u * .56); g.fill();
  g.fillStyle = rg(g, -u * .1, 0, 1, u * .38, [[0, '#6b7bff'], [.5, '#28295a'], [1, '#0a0a18']]); ell(g, 0, u * .1, u * .38, u * .38); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; ell(g, -u * .16, -u * .05, u * .08, u * .06); g.fill();
}
function dCandle(g, u) {
  g.fillStyle = rg(g, 0, -u * .8, 1, u * .95, [[0, 'rgba(255,190,80,.5)'], [1, 'rgba(255,190,80,0)']]); ell(g, 0, -u * .8, u * .95, u * .95); g.fill();
  g.fillStyle = lg(g, -u * .4, 0, u * .4, 0, [[0, '#d9cfae'], [.4, '#fff8e2'], [1, '#cdbf98']]); rr(g, -u * .38, -u * .45, u * .76, u * 1.5, u * .1); g.fill();
  g.fillStyle = '#fff8e2'; ell(g, 0, -u * .45, u * .38, u * .1); g.fill();
  g.fillStyle = '#f0e6c4'; rr(g, u * .1, -u * .45, u * .12, u * .4, u * .06); g.fill();
  g.strokeStyle = '#333'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(0, -u * .45); g.lineTo(0, -u * .6); g.stroke();
  g.fillStyle = lg(g, 0, -u * 1.05, 0, -u * .55, [[0, '#ffd23a'], [1, '#ff7a1a']]);
  g.beginPath(); g.moveTo(0, -u * 1.1); g.bezierCurveTo(u * .3, -u * .8, u * .22, -u * .55, 0, -u * .55); g.bezierCurveTo(-u * .22, -u * .55, -u * .3, -u * .8, 0, -u * 1.1); g.fill();
  g.fillStyle = '#fff6c0'; ell(g, 0, -u * .72, u * .07, u * .13); g.fill();
}
function dApple(g, u) {
  g.fillStyle = rg(g, -u * .3, -u * .3, 1, u * 1.1, [[0, '#ff6b5a'], [.5, '#d62a24'], [1, '#7c0f12']]);
  g.beginPath(); g.moveTo(0, -u * .6); g.bezierCurveTo(u * .35, -u * .95, u * 1.05, -u * .6, u * .95, u * .15); g.bezierCurveTo(u * .85, u * .85, u * .35, u * 1.0, 0, u * .85);
  g.bezierCurveTo(-u * .35, u * 1.0, -u * .85, u * .85, -u * .95, u * .15); g.bezierCurveTo(-u * 1.05, -u * .6, -u * .35, -u * .95, 0, -u * .6); g.fill();
  g.strokeStyle = '#4a2a14'; g.lineWidth = u * .12; g.lineCap = 'round'; g.beginPath(); g.moveTo(0, -u * .55); g.quadraticCurveTo(u * .05, -u * .85, u * .18, -u * 1.0); g.stroke();
  g.fillStyle = lg(g, 0, 0, u * .5, -u * .3, [[0, '#2f7a32'], [1, '#79c85a']]); ell(g, u * .32, -u * .82, u * .3, u * .13, -.45); g.fill();
  g.fillStyle = 'rgba(255,255,255,.55)'; ell(g, -u * .42, -u * .25, u * .12, u * .22, .6); g.fill();
}
function dPen(g, u) {
  g.fillStyle = lg(g, 0, -u * .2, 0, u * .2, [[0, '#6b8bff'], [.5, '#2846c8'], [1, '#14237a']]); rr(g, -u * 1.15, -u * .2, u * 1.9, u * .4, u * .2); g.fill();
  g.fillStyle = '#e6e8ee'; g.beginPath(); g.moveTo(u * .75, -u * .16); g.lineTo(u * 1.2, 0); g.lineTo(u * .75, u * .16); g.closePath(); g.fill();
  g.fillStyle = '#222'; g.beginPath(); g.moveTo(u * 1.08, -u * .04); g.lineTo(u * 1.2, 0); g.lineTo(u * 1.08, u * .04); g.closePath(); g.fill();
  g.fillStyle = '#d0d4dc'; rr(g, -u * .9, -u * .26, u * .8, u * .1, u * .05); g.fill();
  g.fillStyle = 'rgba(255,255,255,.5)'; rr(g, -u * 1.0, -u * .13, u * 1.6, u * .06, u * .03); g.fill();
}
function dSock(g, u) {
  const path = () => { g.beginPath(); g.moveTo(-u * .5, -u * 1.0); g.lineTo(u * .5, -u * 1.0); g.lineTo(u * .5, u * .1); g.lineTo(u * .82, u * .28); g.quadraticCurveTo(u * 1.12, u * .5, u * .85, u * .8); g.lineTo(-u * .2, u * .8); g.quadraticCurveTo(-u * .55, u * .8, -u * .5, u * .4); g.closePath(); };
  path(); g.fillStyle = lg(g, -u * .5, 0, u * .5, 0, [[0, '#d9d2e6'], [.4, '#fbf8ff'], [1, '#bcb3d0']]); g.fill();

// ---------- update ----------
function update(dt) {
  t += dt;
  human.timer -= dt; human.sayT -= dt; bonkT -= dt;
  const diff = Math.min(1, t / 240);
  if (human.timer <= 0) {
    if (human.st === 'busy') { human.st = 'alert'; human.timer = 1.2; }
    else if (human.st === 'alert') { human.st = 'watch'; human.timer = rnd(1.0, 1.4); human.say = '흠?'; human.sayT = 1; say(['나는 무죄다냥 😇', '난 아무것도 안 했는데?', '(순진한 눈)'][Math.floor(Math.random() * 3)], 1.3); }
    else { human.st = 'busy'; human.timer = rnd(4.5, 7.5) - diff * 1.5; }
  }
  patience = Math.max(0, patience - (human.st === 'watch' ? 0 : 2.6) * dt);

  spawnT -= dt;
  const onTable = items.filter(i => i.y < TABLE_Y + 5 && i.x < TX1).length;
  if (spawnT <= 0 || onTable < 4) { if (onTable < 10) spawn(true); spawnT = Math.max(1.1, 2.0 - diff * .8); }

  if (paw.phase === 'out') { paw.p += dt / .08; if (paw.p >= 1) { paw.p = 0; paw.phase = 'back'; impact(); } }

  else if (paw.phase === 'back') { const e = paw.p * paw.p * (3 - 2 * paw.p); paw.x = paw.tx + (IDLE_PAW.x - paw.tx) * e; paw.y = paw.ty + (IDLE_PAW.y - paw.ty) * e; }

  moodT -= dt; if (moodT <= 0) mood = patience > 70 ? 'sad' : 'idle';
  thought.t -= dt;

  const h = 1 / 120; let acc = dt;
  while (acc > 0) { const s = Math.min(h, acc); acc -= s; physics(s); if (state !== 'play') return; }

  for (let i = items.length - 1; i >= 0; i--) { const it = items[i];

    if (it.scored) { it.floorAge += dt; if (it.floorAge > 5) it.alpha -= dt * 1.5; if (it.alpha <= 0) items.splice(i, 1); }
  }

function tickFx(dt) {

  for (const x of texts) { x.y -= 34 * dt; x.life -= dt; }

}

function physics(dt) {
  for (const it of items) {
    const pb = it.y + it.r; it.ground = false;
    it.vy += G * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.a += it.va * dt;
    const r = it.r;
    if (it.x < 12 + r) { it.x = 12 + r; it.vx = Math.abs(it.vx) * .5; }
    if (it.x > W - 12 - r) { it.x = W - 12 - r; it.vx = -Math.abs(it.vx) * .5; }
    if (it.x > TX0 && it.x < TX1 && it.y + r >= TABLE_Y && pb <= TABLE_Y + 8 && it.vy >= 0) {
      it.y = TABLE_Y - r;
      it.vy = it.vy > 200 ? -it.vy * .25 : 0;
      it.ground = it.vy === 0;
      if (it.ground) {
        it.vx *= Math.exp(-(it.def.roll ? .4 : 1.0) * dt);
        it.va = it.def.roll ? it.vx / r : it.va * Math.exp(-7 * dt);
      }
    } else if (it.y + r >= FLOOR_Y) {
      it.y = FLOOR_Y - r;
      if (!it.scored) {
        it.scored = true;
        if (it.def.fragile && it.vy > 180) { it.dead = true; fallEvent(it, true); continue; }
        fallEvent(it, false);
      }
      it.vy = it.vy > 120 ? -it.vy * .42 : 0;
      it.vx *= Math.exp(-(it.def.roll ? .8 : 3.5) * dt);
      it.va = it.def.roll ? it.vx / r : it.va * Math.exp(-5 * dt);
    }
    if (!it.hitHuman && it.x > HUMAN.x - 42 && it.x < HUMAN.x + 42 && it.y > 340 && it.y < FLOOR_Y - 8 && it.vx > 0) {
      it.hitHuman = true; it.vx = -Math.abs(it.vx) * .5; it.vy = -260; it.va = rnd(-12, 12);
      const pts = 200 * combo; score += pts; bonkT = .9; sfx.bonk(); shake = 9;
      pop(HUMAN.x, 300, 'BONK! +' + pts, '#ff8c42', 32, 1.2); addPatience(5);
      human.say = '아야!!'; human.sayT = 1.4;
    }
  }
  for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
    const a = items[i], b = items[j]; const dx = b.x - a.x, dy = b.y - a.y, min = (a.r + b.r) * .92;
    const d2 = dx * dx + dy * dy; if (d2 >= min * min || d2 === 0) continue;
    const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ma = a.r * a.r, mb = b.r * b.r;

    a.vx -= jn * nx / ma; a.vy -= jn * ny / ma; b.vx += jn * nx / mb; b.vy += jn * ny / mb;
  }
}

  let px = tg.x - it.x, py = tg.y - it.y; const pl = Math.hypot(px, py) || 1; px /= pl; py /= pl;
  const ca = Math.cos(-it.a), sa = Math.sin(-it.a); const lx = px * ca - py * sa, ly = px * sa + py * ca;
  for (const s of [-1, 1]) {
    const x0 = cx + s * sep;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#1c1c1c'; ctx.lineWidth = 1.3; ell(ctx, x0, cy, er, er * (air ? 1.15 : 1)); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111';
    let ox, oy, pr;
    if (air) { const a = t * 20 + s * 2; ox = Math.cos(a) * er * .5; oy = Math.sin(a) * er * .5; pr = er * .36; }
    else if (near) { ox = lx * er * .35 + Math.sin(t * 45 + s) * .8; oy = ly * er * .35 + Math.cos(t * 41) * .6; pr = er * .28; }
    else { ox = lx * er * .45; oy = ly * er * .45; pr = er * .5; }
    ell(ctx, x0 + ox, cy + oy, pr, pr); ctx.fill();
  }
  if (air) { ctx.fillStyle = '#4a1010'; ell(ctx, cx, cy + er * 2.1, er * .6, er * .85); ctx.fill(); ctx.fillStyle = '#e8606e'; ell(ctx, cx, cy + er * 2.5, er * .38, er * .35); ctx.fill(); }
  else if (near) { ctx.strokeStyle = '#3a1a1a'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(cx - er * .8, cy + er * 1.9); for (let i = 1; i <= 4; i++) ctx.lineTo(cx - er * .8 + i * er * .4, cy + er * (1.9 + (i % 2 ? .35 : 0))); ctx.stroke();
    ctx.fillStyle = 'rgba(140,210,255,.9)'; const sw = (t * 2) % 1, sx = cx + sep + er * 1.1; ctx.beginPath(); ctx.moveTo(sx, cy - er * 1.3 + sw * er); ctx.quadraticCurveTo(sx + er * .5, cy - er * .5 + sw * er, sx, cy - er * .1 + sw * er); ctx.quadraticCurveTo(sx - er * .5, cy - er * .5 + sw * er, sx, cy - er * 1.3 + sw * er); ctx.fill(); }
  ctx.restore();
}
let vig = null;
function drawVignette() {
  if (!vig) { vig = ctx.createRadialGradient(W / 2, H / 2, 260, W / 2, H / 2, 640); vig.addColorStop(0, 'rgba(20,8,0,0)'); vig.addColorStop(1, 'rgba(20,8,0,.42)'); }
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}
function drawHUD() {
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(30,18,10,.72)'; rr(ctx, 12, 10, 190, 58, 14); ctx.fill();
  ctx.font = `900 34px ${UI_FONT}`; ctx.fillStyle = '#fff'; ctx.fillText(score, 24, 14);
  ctx.font = `700 13px ${UI_FONT}`; ctx.fillStyle = '#ffd9a0'; ctx.fillText('최고 ' + best, 26, 50);
  if (combo > 1 && t - lastEvt < 3.2) {
    const k = 1 - (t - lastEvt) / 3.2; ctx.font = `900 ${26 + combo * 2}px ${UI_FONT}`; ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = 6; ctx.lineJoin = 'round';
    ctx.fillStyle = '#ffd23f'; ctx.strokeText('×' + combo + ' 콤보', 20, 76); ctx.fillText('×' + combo + ' 콤보', 20, 76);
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(20, 76 + 32 + combo * 2, 130 * k, 5);
  }
  const bx = 660, by = 14, bw = 270, bh = 20, f = patience / 100;
  ctx.fillStyle = 'rgba(30,18,10,.72)'; rr(ctx, bx - 14, by - 4, bw + 28, 52, 14); ctx.fill();
  ctx.font = `800 13px ${UI_FONT}`; ctx.fillStyle = '#ffd9a0'; ctx.textAlign = 'left'; ctx.fillText('집사 분노 게이지', bx, by);
  ctx.textAlign = 'right'; ctx.fillText(Math.round(patience) + '%', bx + bw, by);
  ctx.fillStyle = 'rgba(255,255,255,.14)'; rr(ctx, bx, by + 20, bw, bh, 10); ctx.fill();
  const col = f < .5 ? ['#7be58a', '#3fbf5b'] : f < .8 ? ['#ffd15a', '#ff9a1f'] : ['#ff6a4a', '#e01d1d'];
  ctx.fillStyle = lg(ctx, bx, 0, bx + bw, 0, [[0, col[0]], [1, col[1]]]); if (f > .01) { rr(ctx, bx, by + 20, Math.max(20, bw * f), bh, 10); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.25)'; rr(ctx, bx + 4, by + 22, Math.max(12, bw * f - 8), 5, 2.5); if (f > .01) ctx.fill();
  if (f > .8) { ctx.globalAlpha = .5 + .5 * Math.sin(t * 16); ctx.font = `900 12px ${UI_FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('폭발 직전!!', bx + bw / 2, by + 30); ctx.globalAlpha = 1; }
  if (state === 'play' && human.st === 'watch') { ctx.font = `900 22px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ff5a3c'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    const s = '지금은 치지 마!'; ctx.strokeText(s, 770, 220); ctx.fillText(s, 770, 220); }
  if (state === 'play' && human.st === 'alert') { ctx.font = `800 16px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#3b2a1a'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeText('집사가 고개를 든다…', 770, 220); ctx.fillText('집사가 고개를 든다…', 770, 220); }
}
function drawPaw(x, y) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(-.3); ctx.globalAlpha = .9;
  ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.strokeStyle = 'rgba(40,20,10,.7)'; ctx.lineWidth = 1.5;
  ell(ctx, 0, 5, 9, 7.5); ctx.fill(); ctx.stroke();
  for (const [dx, dy] of [[-10, -5], [-4, -11], [4, -11], [10, -5]]) { ell(ctx, dx, dy, 3.6, 4.4); ctx.fill(); ctx.stroke(); }
  ctx.restore();
}
function render() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.fillStyle = '#1d1410'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (zoom > 0) { ctx.translate(W / 2, H / 2); ctx.scale(1 + zoom, 1 + zoom); ctx.translate(-W / 2, -H / 2); }
  if (shake > 0) ctx.translate(rnd(-shake, shake) * .6, rnd(-shake, shake) * .6);
  ctx.drawImage(bg, 0, 0, W, H); drawClock();
  for (const d of decals) { ctx.globalAlpha = Math.min(1, d.life / 3) * .8; ctx.fillStyle = d.col; ell(ctx, d.x, d.y, d.rx, d.rx * .18); ctx.fill(); ctx.globalAlpha = 1; }
  for (const it of items) drawShadow(it);
  drawHuman();
  for (const it of items) drawItem(it);
  drawCat();
  for (const p of parts) { ctx.save(); ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.col;
    if (p.kind === 'line') { ctx.fillRect(p.len * .35, -1.3, p.len, 2.6); }
    else if (p.kind === 'star') { ctx.fillRect(-1.5, -p.size * 1.5, 3, p.size * 3); ctx.fillRect(-p.size * 1.5, -1.5, p.size * 3, 3); }
    else if (p.kind === 'drop') { ell(ctx, 0, 0, p.size, p.size); ctx.fill(); }
    else { ctx.beginPath(); ctx.moveTo(-p.size, p.size * .6); ctx.lineTo(p.size, 0); ctx.lineTo(-p.size * .2, -p.size); ctx.closePath(); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = .8; ctx.stroke(); }
    ctx.restore(); }
  ctx.restore();
  drawVignette();
  ctx.save(); if (shake > 0) ctx.translate(rnd(-shake, shake) * .3, rnd(-shake, shake) * .3);
  for (const x of texts) { ctx.save(); ctx.globalAlpha = Math.min(1, x.life / x.max * 2); ctx.font = `900 ${x.size}px ${UI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.translate(x.x, x.y); ctx.rotate(x.rot || 0); if (x.size > 40) { const k2 = 1 + Math.max(0, x.life / x.max - .7) * 1.2; ctx.scale(k2, k2); }
    ctx.lineWidth = 5; ctx.strokeStyle = '#3b2a1a'; ctx.lineJoin = 'round'; ctx.strokeText(x.s, 0, 0); ctx.fillStyle = x.col; ctx.fillText(x.s, 0, 0); ctx.restore(); }
  ctx.restore();
  drawHUD();
  if (state === 'play' && mouse.in) drawPaw(mouse.x, mouse.y);
}

// ---------- loop & input ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else { t += dt; thought.t -= dt; human.sayT -= dt; tickFx(dt); }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function toLogical(e) { const r = cvs.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cvs.addEventListener('pointermove', e => { const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true; });
cvs.addEventListener('pointerleave', () => mouse.in = false);
cvs.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio(); const p = toLogical(e); mouse.x = p.x; mouse.y = p.y; mouse.in = true;
  if (state === 'play') startSwat(p.x, p.y);
});
function start() {
  ensureAudio(); reset(); state = 'play'; $('title').classList.remove('show'); $('over').classList.remove('show'); sfx.meow();
  say('오늘도 중력을 검증해볼까…', 2.4);
}
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);
addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') { e.preventDefault(); if (state === 'title' || $('over').classList.contains('show')) start(); } });
$('mute').addEventListener('click', () => { muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊'; ensureAudio(); });
})();
</script>
